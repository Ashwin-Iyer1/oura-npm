name: Verify library and sample gallery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/demo-app/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked library and gallery dependencies
        run: |
          npm ci
          npm --prefix examples/demo-app ci
      - name: Test client, hook and chart regressions
        run: npm test
      - name: Type-check and build the library and sample gallery
        run: npm run build:demo
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify local gallery workflows and responsive layouts
        run: npm run test:ui
